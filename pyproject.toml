[project]
name = "devdb"
version = "0.2.0"
description = "Instant isolated Postgres test databases for developers"
readme = "README.md"
authors = [
    { name = "BlackStarCodes", email = "301748195+BlackStarCodes@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "portalocker>=4.1.0",
    "psycopg2-binary>=2.9.12",
    "pyyaml>=6.0.3",
    "typer>=0.27.1",
]

[project.scripts]
devdb = "devdb.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devdb"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "types-pyyaml>=6.0.12.20260815",
    "alembic>=1.13.0",
]
