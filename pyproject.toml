[project]
name = "devdb"
version = "0.1.0"
description = "Instant isolated Postgres test databases for developers"
readme = "README.md"
authors = [
    { name = "BlackStarCodes", email = "301748195+BlackStarCodes@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary>=2.9.12",
    "pyyaml>=6.0.3",
    "typer>=0.27.1",
]

[project.scripts]
devdb = "devdb.cli:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "types-pyyaml>=6.0.12.20260815",
]