name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]


jobs:
    unit-tests:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                python-version: "3.11"

            - name: Install dependencies
              run: |
                uv sync --dev

            - name: Run unit tests
              run: uv run pytest tests/unit/ -v

    
    integration-tests:
        runs-on: ubuntu-latest


        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                python-version: "3.11"

            - name: Install dependencies
              run: |
                uv sync --dev

            - name: Run integration tests
              run: uv run pytest tests/integration/ -v
